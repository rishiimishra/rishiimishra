<svg xmlns="http://www.w3.org/2000/svg" width="850" height="70" viewBox="0 0 850 70">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #ff1a1a; stroke-width: 1.5; rx: 8px; }
      .text-track {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 2px;
        fill: #ff3333;
        animation: marquee 12s linear infinite;
