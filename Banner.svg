<svg width="100%" height="110" viewBox="0 0 1200 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Cyber Security Engineer at Thales banner</title>
  <desc id="bannerDesc">A red and black cyber security themed running marquee banner.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07090d" />
      <stop offset="25%" stop-color="#12151b" />
      <stop offset="50%" stop-color="#1a1e27" />
      <stop offset="75%" stop-color="#12151b" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>

    <!-- Red-Black Metallic Shine Gradient -->
    <linearGradient id="redShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="25%" stop-color="#800000" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#800000" />
      <stop offset="100%" stop-color="#ff1a1a" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ff3b30" flood-opacity="0.8" />
    </filter>

    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="110" rx="10" />
    </clipPath>
  </defs>

  <!-- Banner Card Frame -->
  <rect width="1200" height="110" rx="10" fill="url(#bgGlow)" stroke="#ff2a2a" stroke-width="1.5" />

  <!-- Subtle Accent Grid Lines -->
  <g fill="none">
    <path d="M0 18 H1200" stroke="#ff4040" stroke-opacity="0.3" stroke-width="1" />
    <path d="M0 92 H1200" stroke="#ff4040" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <!-- Animated Marquee Track (Passes GitHub's Camo Proxy) -->
  <g clip-path="url(#bannerClip)" filter="url(#softGlow)">
    <!-- Primary Moving Headline -->
    <text y="54" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="3" fill="url(#redShine)">
      ⚡ CYBER SECURITY ENGINEER @ THALES 🛡️ L1 SUPPORT & TRIAGE ⚡ CYBER SECURITY ENGINEER @ THALES 🛡️ L1 SUPPORT & TRIAGE ⚡
      <animate attributeName="x" from="1200" to="-1400" dur="16s" repeatCount="indefinite" />
    </text>

    <!-- Subtitle Marquee in Reverse Direction -->
    <text y="78" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ff7a7a">
      CRYPTOGRAPHY • NETWORK SECURITY • PKI • INCIDENT RESOLUTION • SYSTEM HARDENING •
      <animate attributeName="x" from="-1400" to="1200" dur="20s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
