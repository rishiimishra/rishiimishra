  <rect width="100%" height="100%" class="bg" />
  
  <g class="text-track">
    <text y="44">⚡ CYBER SECURITY ENGINEER @ THALES 🛡️ L1 SUPPORT & TRIAGE ⚡ CYBER SECURITY ENGINEER @ THALES 🛡️</text>
  </g>
</svg>

